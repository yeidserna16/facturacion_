version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: castor_postgres
    restart: always
    environment:
      POSTGRES_DB: castor_db
      POSTGRES_USER: castor
      POSTGRES_PASSWORD: castor123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: castor_oracle
    restart: always
    environment:
      ORACLE_PASSWORD: oracle123
      APP_USER: castor
      APP_USER_PASSWORD: castor123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata

volumes:
  postgres_data:
  oracle_data:
