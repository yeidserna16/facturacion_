spring.application.name=facturacion
server.port=8085

#  POSTGRESQL
# --------------------------------------------------------------
spring.datasource.postgresql.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/castor_db}
spring.datasource.postgresql.username=${SPRING_DATASOURCE_USERNAME:castor}
spring.datasource.postgresql.password=${SPRING_DATASOURCE_PASSWORD:castor123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000


# ORACLE
# -----------------------------------------------------------------
spring.datasource.oracle.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.oracle.username=${ORACLE_USER:castor}
spring.datasource.oracle.password=${ORACLE_PASSWORD:castor123}
spring.datasource.oracle.driver-class-name=oracle.jdbc.driver.OracleDriver

spring.datasource.oracle.hikari.maximum-pool-size=10
spring.datasource.oracle.hikari.minimum-idle=2
spring.datasource.oracle.hikari.connection-timeout=30000
spring.datasource.oracle.hikari.idle-timeout=30000

#Para Python
# URL al microservicio Python
python.factura.url=http://localhost:5001